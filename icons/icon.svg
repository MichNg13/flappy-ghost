<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050f"/>
      <stop offset=".65" stop-color="#0b1638"/>
      <stop offset="1" stop-color="#14234d"/>
    </linearGradient>
    <radialGradient id="body" cx=".42" cy=".34" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c9fdff"/>
      <stop offset="1" stop-color="#7ff7ff" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset=".45" stop-color="#d4ff6a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d4ff6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- night sky, full bleed so it works as a maskable icon -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="98" cy="118" r="2.6" opacity=".9"/><circle cx="150" cy="70" r="2" opacity=".7"/>
    <circle cx="232" cy="96" r="2.2" opacity=".8"/><circle cx="70" cy="214" r="1.8" opacity=".6"/>
    <circle cx="300" cy="62" r="1.8" opacity=".6"/><circle cx="452" cy="230" r="2.2" opacity=".7"/>
    <circle cx="430" cy="58" r="2" opacity=".6"/>
  </g>

  <!-- moon -->
  <circle cx="372" cy="142" r="78" fill="url(#moonGlow)"/>
  <circle cx="372" cy="142" r="38" fill="#ecffb8"/>
  <circle cx="360" cy="132" r="8" fill="#cfe890" opacity=".7"/>
  <circle cx="384" cy="156" r="10" fill="#cfe890" opacity=".7"/>

  <!-- ground and grave -->
  <path d="M0 428 Q128 404 256 418 T512 410 V512 H0Z" fill="#050c10"/>
  <path d="M0 428 Q128 404 256 418 T512 410" fill="none" stroke="#2dffc4" stroke-width="5" filter="url(#soft)"/>
  <path d="M378 416 V362 a28 28 0 0 1 56 0 V412" fill="#160b27" stroke="#ff4fd8" stroke-width="6" stroke-linejoin="round" filter="url(#soft)"/>
  <path d="M406 354 v32 M395 366 h22" stroke="#ff4fd8" stroke-width="5" stroke-linecap="round" opacity=".85"/>

  <!-- ghost trail -->
  <g fill="#7ff7ff" filter="url(#soft)">
    <circle cx="112" cy="318" r="9" opacity=".75"/><circle cx="82" cy="336" r="6.5" opacity=".55"/>
    <circle cx="58" cy="350" r="4.5" opacity=".4"/>
  </g>

  <!-- ghost -->
  <g transform="rotate(-8 246 270)">
    <path d="M128 262 A118 118 0 0 1 364 262 V368
             Q344 400 325 368 Q305 400 285 368 Q266 400 246 368
             Q226 400 207 368 Q187 400 167 368 Q148 400 128 368 Z"
          fill="url(#body)" stroke="#7ff7ff" stroke-width="9" stroke-linejoin="round" filter="url(#neon)"/>
    <ellipse cx="204" cy="258" rx="17" ry="24" fill="#08142a"/>
    <ellipse cx="290" cy="258" rx="17" ry="24" fill="#08142a"/>
    <circle cx="210" cy="249" r="6" fill="#fff"/><circle cx="296" cy="249" r="6" fill="#fff"/>
    <circle cx="168" cy="300" r="13" fill="#ff4fd8" opacity=".45"/>
    <circle cx="326" cy="300" r="13" fill="#ff4fd8" opacity=".45"/>
    <ellipse cx="248" cy="314" rx="13" ry="16" fill="#08142a"/>
  </g>
</svg>
